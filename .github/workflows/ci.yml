name: Phase 2 CI
on:
  push:
    branches: [phase-2]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-ci-only-secret-1234567890
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
